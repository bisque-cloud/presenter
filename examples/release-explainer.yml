# Every published release gets a narrated explainer, linked from the release
# notes. Set one secret: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`
# runs on your Claude plan, or set one provider API key instead and the
# action picks that provider's best model; add `model:` to name a different
# one. Authoring runs on your plan or key, narration runs on this runner, and
# the explainer publishes to this repository's own channel,
# bisque.today/p/{owner}/{repo}, with the run's GitHub identity.
name: Release explainer

on:
  release:
    types: [published]

permissions:
  contents: write # append the watch link to the release notes
  id-token: write # publish as this repository, no Bisque account

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - uses: bisque-cloud/presenter@v1
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
