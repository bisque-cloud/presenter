# Every published release gets a narrated explainer, linked from the release
# notes. Set one provider key and the action picks that provider's best
# model for the job; add `model:` to name a different one. Authoring runs on
# your key, narration runs on this runner, and the Bisque key only names the
# channel the page lands on.
name: Release explainer

on:
  release:
    types: [published]

permissions:
  contents: write # append the watch link to the release notes

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - uses: bisque-cloud/presenter@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          bisque-api-key: ${{ secrets.BISQUE_API_KEY }}
          bisque-user-id: ${{ secrets.BISQUE_USER_ID }}
