# Your code-review agent publishes a presentation of the pull requests worth
# explaining, in the same run as the review.
#
# The point of doing it here rather than in a second job: the reviewing agent
# has already read the diff. It decides whether the change is worth explaining
# and writes the presentation from what it understood reviewing it, so nothing
# re-reads the pull request and no second model runs.
#
# The review is the deliverable and finishes first. A presentation that fails
# or runs long therefore costs you the presentation and nothing else.
#
# Needs BISQUE_API_KEY and BISQUE_USER_ID. Get them by running
# `node present.mjs login` once from the installed skill and copying the two
# values out of ~/.bisque/config.json.
name: Code review, with a presentation

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    # The review is the long pole; narration adds a few minutes on top.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write # post the review and the watch link
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Narration runs on this runner. Without the cache, the first run of the
      # day downloads the speech model again — about 340 MB.
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.bisque/models
          key: bisque-voice-models-${{ runner.os }}-${{ runner.arch }}-v1

      - uses: anthropics/claude-code-action@v1
        env:
          # The present skill reads these, and they beat ~/.bisque/config.json.
          BISQUE_API_KEY: ${{ secrets.BISQUE_API_KEY }}
          BISQUE_USER_ID: ${{ secrets.BISQUE_USER_ID }}
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/bisque-cloud/presenter.git
          plugins: |
            code-review@claude-code-plugins
            presenter@bisque-cloud
          prompt: |
            Do these in order. The review is the deliverable; the presentation
            is a bonus that must never cost the review.

            1. Run `/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}`
               and post it. Finish this completely before step 2.

            2. Decide whether pull request #${{ github.event.pull_request.number }}
               is worth explaining to someone who did not write it. Yes for a
               design decision, a new surface or command, a migration, a change
               that spans packages, or anything where the reasoning matters
               more than the diff. No for a dependency bump, formatting, a
               lockfile, a typo, a one-line fix, or a change only its author
               will ever read.

               Then read the pull request's existing comments. If a watch link
               is already posted and nothing substantial has changed since,
               skip — a push should not republish the same walkthrough.

            3. If it is worth explaining, use the `present` skill to make and
               publish a presentation of this pull request: what it changes,
               why, and what someone reviewing it should look at.

               Pass `--visibility unlisted`, so a private repository's diffs
               never land on a public channel. On a public repository, pass
               `--visibility public` instead.

               Narration runs here and must not be skipped. `bisque-voice` is
               at `~/.bisque/bin/bisque-voice` and is never on PATH; the skill
               installs it and a speech engine on first use. If it fails, say
               what the command printed rather than guessing at a cause, and
               do not publish a silent presentation.

               Post the watch URL as a pull request comment:
               `gh pr comment ${{ github.event.pull_request.number }} --body "..."`

            4. If it is not worth explaining, post one comment saying so and
               why, in a sentence. A skipped presentation and a failed one must
               not look the same from the pull request.
          # Bash is off unless you allow it, and the skill needs a shell to
          # narrate and publish. --allowedTools adds to the base GitHub tools
          # rather than replacing them.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash,Read,Write,Edit,Glob,Grep"
