name: Pull Request Explainer
description: >-
  A watchable explainer of your pull requests, made by the model you already
  pay for and linked in a comment. Mention @bisque-cloud, or let it pick the
  ones worth explaining. Bring your own key or your Claude plan; no Bisque
  account needed. Also explains releases.
author: Bisque
branding:
  icon: play-circle
  color: orange

inputs:
  # Set one of these. The key names the provider, and the provider decides
  # the model, so the simplest workflow names no model at all.
  claude-code-oauth-token:
    description: >-
      Runs Claude Code on your Claude Pro, Max, Team or Enterprise plan. Make
      one with `claude setup-token`. Defaults to the model Claude Code picks
      for your plan.
    required: false
    default: ""
  anthropic-api-key:
    description: Runs Anthropic. Defaults to claude-opus-5 at medium effort.
    required: false
    default: ""
  openai-api-key:
    description: Runs OpenAI. Defaults to gpt-5.6-sol at medium effort.
    required: false
    default: ""
  google-api-key:
    description: Runs Google. Defaults to gemini-3.1-pro-preview.
    required: false
    default: ""
  xai-api-key:
    description: Runs xAI. Defaults to grok-4.6.
    required: false
    default: ""

  model:
    description: >-
      Override the default with a `provider/model` id from
      https://models.dev, for example `anthropic/claude-sonnet-4-6`. Its
      provider must be the one whose key you supplied. OpenCode runs it, so
      any model in the catalog works without a new release of this action.
    required: false
    default: ""
  variant:
    description: Reasoning effort, where the provider has one (for example high, max, minimal).
    required: false
    default: ""
  claude-code-version:
    description: >-
      The Claude Code release that runs a `claude-code-oauth-token`. Pinned for
      the same reason as opencode-version.
    required: false
    default: "2.1.296"
  opencode-version:
    description: >-
      The OpenCode release that runs the model. Pinned so an upstream release
      cannot change what this action does overnight; raise it deliberately.
    required: false
    default: "1.18.30"

  network:
    description: >-
      `allow` (default) or `deny`. The agent uses a shell and the network to
      download the fonts and images the presentation format requires. Denying
      both contains contributor-controlled text on a repository that takes
      pull requests from strangers, and costs custom typography.
    required: false
    default: "allow"

  source:
    description: What to explain. `release` (the release that fired the workflow) or `pull-request`.
    required: false
    default: "release"
  tag:
    description: Explain this release tag instead of the one in the event. For manual runs.
    required: false
    default: ""
  pull-request:
    description: Explain this pull request number instead of the one in the event. For manual runs.
    required: false
    default: ""
  when:
    description: >-
      `always` (default) explains every pull request the workflow runs for.
      `judged` has the model decide first whether the pull request is worth
      explaining to someone who did not write it; when it is not, nothing is
      published or commented, and the reason is in the run's log. Applies
      only to runs started by a `pull_request` or `pull_request_target`
      event: a mention or a manual run always explains, because somebody
      asked.
    required: false
    default: "always"

  presentation:
    description: >-
      Publish a presentation an earlier job already wrote, instead of writing
      one: the folder holding its index.html and, optionally, context.md,
      assets/ and the audio/ the skill's `narrate` wrote. For a workflow that
      authors with anthropics/claude-code-action and the presenter plugin,
      which cannot publish from inside Claude's session, so Claude writes,
      checks and narrates there. No model runs and no key is needed; this
      step publishes that narration in the voice and speed it was made in,
      narrates only slides it lacks, and posts the link. Run it in its own
      job, after the one that wrote the folder, so nothing the agent touched
      runs with the publishing identity. A relative path is read from the
      workspace.
    required: false
    default: ""

  voice:
    description: >-
      The voice that narrates, engine-qualified, like kokoro:am_michael.
      Empty narrates in kokoro:af_heart. Narration runs on this runner, and
      whatever engine this names is downloaded on the first run and cached; a
      Studio voice (qwen3-*) is a multi-gigabyte download.
    required: false
    default: ""
  visibility:
    description: >-
      public, unlisted or private. Empty means public for a public repository
      and private for a private one, which only people who can open the
      repository on GitHub can watch, so private notes never land on a public
      channel by default.
    required: false
    default: ""
  github-token:
    description: Token used to read the release or pull request and to post the watch link.
    required: false
    default: ${{ github.token }}

outputs:
  watch-url:
    description: The published explainer.
    value: ${{ steps.publish.outputs.watch-url }}
  presentation-id:
    description: The presentation id, for analytics and republishing.
    value: ${{ steps.publish.outputs.presentation-id }}
  skipped:
    description: >-
      `true` when `when: judged` decided against an explainer. The run still
      succeeds, and nothing is published.
    value: ${{ steps.agent.outputs.skipped }}
  skip-reason:
    description: The one sentence the model gave for skipping. It is not posted on the pull request.
    value: ${{ steps.agent.outputs.skip-reason }}
  refused:
    description: >-
      On a pull request, `auth` when the provider refused the key (expired or
      revoked) and `limit` when the plan or account was out of quota. The run
      still succeeds, with a warning, and nothing is published. `auth` leaves
      a note naming the secret; `limit` leaves no comment. Empty otherwise.
    value: ${{ steps.agent.outputs.refused }}

runs:
  using: composite
  steps:
    # Third-party actions are pinned to a full commit SHA, which GitHub calls
    # the only way to use an action as an immutable release. The comment is
    # the tag that SHA carried when it was pinned.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"

    - name: Gather the release or pull request
      id: source
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE: ${{ inputs.source }}
        TAG_INPUT: ${{ inputs.tag }}
        PR_INPUT: ${{ inputs.pull-request }}
        WHEN: ${{ inputs.when }}
        EVENT_NAME: ${{ github.event_name }}
        VOICE: ${{ inputs.voice }}
        EVENT_PATH: ${{ github.event_path }}
        REPO: ${{ github.repository }}
        WORK: ${{ runner.temp }}/release-explainer
        ACTION_PATH: ${{ github.action_path }}
      run: node "${{ github.action_path }}/action/src/gather-release-or-pull-request.ts"

    # Recorded before the agent runs. The publish step refuses a skill whose
    # hash no longer matches, so nothing the agent edited runs with the
    # repository's GitHub identity.
    - name: Snapshot the skill
      id: skill
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "${{ github.action_path }}/action/src/install-and-verify-skill.ts" hash

    # The only step that holds the provider key. It hands the key to a local
    # proxy over stdin and exits, so the agent step below runs with no key in
    # its environment and none in any process environment it can read.
    # On a pull request with no key, it passes and says so instead, and the
    # steps that need a model are skipped: the last step posts the note.
    # Publishing a `presentation` an earlier job wrote needs no model at all.
    - name: Start the key proxy
      id: proxy
      if: inputs.presentation == ''
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        MODEL: ${{ inputs.model }}
        VARIANT: ${{ inputs.variant }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GOOGLE_API_KEY: ${{ inputs.google-api-key }}
        XAI_API_KEY: ${{ inputs.xai-api-key }}
        WORK: ${{ runner.temp }}/release-explainer
      run: node "${{ github.action_path }}/action/src/key-proxy-lifecycle.ts" start

    # A pinned npm release rather than `curl | bash`: the version is visible
    # in the workflow, npm verifies the package, and an upstream release
    # cannot change what this action does without an edit here.
    - name: Install OpenCode
      if: steps.proxy.outputs.engine == 'opencode'
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.opencode-version }}
      run: npm install -g --no-fund --no-audit "opencode-ai@${OPENCODE_VERSION}"

    - name: Install Claude Code
      if: steps.proxy.outputs.engine == 'claude-code'
      shell: bash
      env:
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
      run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

    # Before the agent, which downloads the voice the first time it checks
    # pronunciations. Restore and save are split because the voice is not
    # known until publish resolves it from the account, so the saved key is
    # named after the models actually installed, not after an input that may
    # be empty. A `presentation` arrives narrated, so its publish needs no
    # model unless the earlier job left slides without audio.
    - name: Restore the speech models
      id: models-cache
      if: inputs.presentation == '' && steps.proxy.outputs.missing-key != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bisque/models
        key: bisque-voice-models-${{ runner.os }}-${{ runner.arch }}-v2
        restore-keys: |
          bisque-voice-models-${{ runner.os }}-${{ runner.arch }}-

    # The agent runs the skill's own checks (plan, pronunciation-report)
    # before it stops, and both need the engine. Publish reuses this binary.
    - name: Install bisque-voice
      if: steps.proxy.outputs.missing-key != 'true'
      shell: bash
      run: node "${{ github.action_path }}/action/src/install-bisque-voice.ts"

    - name: Author with ${{ steps.proxy.outputs.model }}
      id: agent
      if: inputs.presentation == '' && steps.proxy.outputs.missing-key != 'true'
      shell: bash
      env:
        MODEL: ${{ steps.proxy.outputs.model }}
        VARIANT: ${{ steps.proxy.outputs.variant }}
        BASE_PATH: ${{ steps.proxy.outputs.base-path }}
        NETWORK: ${{ inputs.network }}
        SOURCE: ${{ inputs.source }}
        MODE: ${{ steps.source.outputs.mode }}
        PROXY_PORT: ${{ steps.proxy.outputs.port }}
        ACTION_PATH: ${{ github.action_path }}
        WORK: ${{ runner.temp }}/release-explainer
      # The runner hands every step the means to mint this job's GitHub OIDC
      # token, which is what publishes. `exec env -u` drops them before node
      # starts, so the agent cannot read them back from its parent process
      # (/proc/<pid>/environ shows the environment of the last exec).
      run: >-
        exec env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
        -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RESULTS_URL
        node "${{ github.action_path }}/action/src/run-agent-headless.ts"

    - name: Stop the key proxy
      if: always()
      shell: bash
      env:
        WORK: ${{ runner.temp }}/release-explainer
      run: node "${{ github.action_path }}/action/src/key-proxy-lifecycle.ts" stop

    # Publish-only: the folder an earlier job wrote stands where the agent's
    # output would, so the checks and the publish below treat it the same.
    - name: Take the presentation an earlier job wrote
      id: take
      if: inputs.presentation != ''
      shell: bash
      env:
        PRESENTATION: ${{ inputs.presentation }}
        WORK: ${{ runner.temp }}/release-explainer
      run: node "${{ github.action_path }}/action/src/take-presentation.ts"

    # A skipped run (`when: judged`) wrote no presentation, so there is
    # nothing to check, publish or comment. Neither did a run with no key, or
    # one the provider refused; the last step decides what, if anything, to
    # say on the pull request. A `presentation` was checked by the skill's
    # `plan` and `narrate` in the job that wrote it, where a problem could
    # still be fixed; this check is for this Action's own agent, whose prompt
    # asks for more than the format does.
    - name: Check the presentation
      if: inputs.presentation == '' && steps.agent.outputs.skipped != 'true' && steps.agent.outputs.refused == '' && steps.proxy.outputs.missing-key != 'true'
      shell: bash
      env:
        WORK: ${{ runner.temp }}/release-explainer
      run: node "${{ github.action_path }}/action/src/check-presentation-structure.ts" "$WORK/out"

    - name: Narrate on this runner and publish
      id: publish
      if: steps.agent.outputs.skipped != 'true' && steps.agent.outputs.refused == '' && steps.proxy.outputs.missing-key != 'true'
      shell: bash
      env:
        # Publish as this repository, with the run's GitHub identity, to
        # bisque.today/p/{owner}/{repo}. No Bisque account or key.
        BISQUE_GITHUB_OIDC: "1"
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
        EXPECTED_HASH: ${{ steps.skill.outputs.hash }}
        # The voice input wins; else a `presentation` publishes in the voice
        # and speed its narration was made in, so that audio ships as judged.
        VOICE: ${{ inputs.voice || steps.take.outputs.voice }}
        SPEED: ${{ inputs.voice == '' && steps.take.outputs.speed || '' }}
        VISIBILITY: ${{ inputs.visibility }}
        WORK: ${{ runner.temp }}/release-explainer
        TITLE: ${{ steps.source.outputs.title }}
        SLUG: ${{ steps.source.outputs.slug }}
      run: node "${{ github.action_path }}/action/src/narrate-and-publish.ts"

    # A run that narrated nothing (a skipped pull request, or a failure before
    # narration on a runner with no cached voice) has no models folder. That
    # names no models, so nothing is saved, rather than failing the job.
    - name: Name the installed speech models
      id: models
      if: always()
      shell: bash
      run: |
        key=$(cd ~/.bisque/models 2>/dev/null && ls -d */ 2>/dev/null | tr -d / | sort | paste -sd+ -) || key=""
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Save the speech models
      if: always() && steps.models.outputs.key != '' && steps.models-cache.outputs.cache-matched-key != format('bisque-voice-models-{0}-{1}-{2}-v2', runner.os, runner.arch, steps.models.outputs.key)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bisque/models
        key: bisque-voice-models-${{ runner.os }}-${{ runner.arch }}-${{ steps.models.outputs.key }}-v2

    # The agent's working directory, minus the proxy state, so a bad run can
    # be read from the job page instead of reproduced.
    - name: Upload the working files
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-explainer-${{ steps.proxy.outputs.provider || 'publish-only' }}
        path: |
          ${{ runner.temp }}/release-explainer
          !${{ runner.temp }}/release-explainer/key-proxy.*
        retention-days: 7
        if-no-files-found: ignore

    - name: Post the watch link where the ${{ inputs.source }} is read
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE: ${{ inputs.source }}
        REPO: ${{ github.repository }}
        TAG: ${{ steps.source.outputs.tag }}
        PR_NUMBER: ${{ steps.source.outputs.pr-number }}
        TITLE: ${{ steps.source.outputs.title }}
        WATCH_URL: ${{ steps.publish.outputs.watch-url }}
        SKIPPED: ${{ steps.agent.outputs.skipped }}
        SKIP_REASON: ${{ steps.agent.outputs.skip-reason }}
        MISSING_KEY: ${{ steps.proxy.outputs.missing-key }}
        REFUSED: ${{ steps.agent.outputs.refused }}
        PRESENTATION_ID: ${{ steps.publish.outputs.presentation-id }}
        # Whose storage the poster image is under: the repository channel's.
        BISQUE_USER_ID: github-repo-${{ github.repository_id }}
      run: node "${{ github.action_path }}/action/src/post-watch-link.ts"
